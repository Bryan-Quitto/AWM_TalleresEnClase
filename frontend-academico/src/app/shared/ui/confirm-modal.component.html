<app-modal [titulo]="titulo()" (cerrar)="onCancelar()">
  <div class="space-y-5">
    <div class="flex items-start gap-3">
      @if (variant() === "danger") {
        <div class="shrink-0 w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" class="w-5 h-5 text-brand-700">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
        </div>
      } @else {
        <div class="shrink-0 w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" class="w-5 h-5 text-brand-700">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
          </svg>
        </div>
      }
      <p class="text-sm text-ink-700 leading-relaxed">{{ mensaje() }}</p>
    </div>

    <div class="flex justify-end gap-3 pt-1">
      <button
        type="button"
        (click)="onCancelar()"
        class="rounded-lg px-4 py-2.5 text-sm font-semibold text-ink-700 hover:bg-brand-50"
      >
        {{ textoCancelar() }}
      </button>
      <button
        type="button"
        (click)="onConfirmar()"
        class="rounded-lg px-4 py-2.5 text-sm font-semibold text-white"
        [class.bg-brand-700]="variant() === 'info'"
        [class.hover:bg-brand-800]="variant() === 'info'"
        [class.bg-brand-900]="variant() === 'danger'"
        [class.hover:bg-brand-800]="variant() === 'danger'"
      >
        {{ textoConfirmar() }}
      </button>
    </div>
  </div>
</app-modal>
