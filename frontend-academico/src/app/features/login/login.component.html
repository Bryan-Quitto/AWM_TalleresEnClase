<div class="min-h-screen flex flex-col md:flex-row">
  <!-- Panel izquierdo (Formulario) -->
  <div class="md:w-1/2 bg-white flex items-center justify-center px-6 py-16 relative">
    <div class="w-full max-w-sm">
      <div class="mb-10 text-center md:text-left">
        <img src="logo.png" alt="Logo U" class="h-24 mb-6 mx-auto md:mx-0 object-contain" />
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
        <div>
          <label for="correo" class="block text-sm font-medium text-ink-900 mb-1.5">Usuario</label>
          <input
            id="correo"
            name="correo"
            type="email"
            required
            autocomplete="username"
            [ngModel]="correo()"
            (ngModelChange)="correo.set($event)"
            placeholder="Introduce tu usuario"
            class="w-full border-2 border-ink-900 bg-white px-3.5 py-2.5 text-sm text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-brand-900 shadow-sm rounded-none"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-ink-900 mb-1.5">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            placeholder="••••••••••••"
            class="w-full border-2 border-ink-900 bg-white px-3.5 py-2.5 text-sm text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-brand-900 shadow-sm rounded-none"
          />
        </div>

        @if (errorMsg()) {
          <p class="text-sm text-brand-600" role="alert">{{ errorMsg() }}</p>
        }

        <div class="pt-6">
          <button
            type="submit"
            [disabled]="cargando() || loginForm.invalid"
            class="w-[200px] flex mx-auto items-center justify-center rounded-xl bg-brand-900 px-4 py-3 text-lg font-bold text-white transition hover:bg-brand-800 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ cargando() ? "Ingresando..." : "Ingresa" }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Panel derecho (Imagen) -->
  <div class="md:w-1/2 bg-slate-200 hidden md:block bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80')">
  </div>
</div>
